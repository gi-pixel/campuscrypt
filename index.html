<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CampusCrypt — Anonymous Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-tab { color: white; position: relative; }
        .active-tab::after { content: ''; position: absolute; bottom: -14px; left: 0; width: 100%; height: 4px; background: #1d9bf0; border-radius: 10px; }
        .active-filter { background: #1d9bf0 !important; color: white !important; border-color: #1d9bf0 !important; }
        .liked { color: #f91880 !important; }
        .comment-hover:hover { color: #1d9bf0; }
        .like-hover:hover { color: #f91880; }
    </style>
</head>
<body class="bg-black text-white">

    <div class="max-w-[430px] mx-auto min-h-screen bg-black border-x border-[#222] pb-[68px] relative">
        
        <!-- Header -->
        <div class="sticky top-0 bg-black z-10 border-b border-[#222] px-4 py-3">
            <div class="flex items-center gap-3 bg-[#16181c] rounded-full px-4 py-3 text-[#777] text-sm">
                <i class="fas fa-search"></i>
                <span>Anonymous campus feed</span>
            </div>
            
            <!-- Tabs -->
            <div class="flex justify-around mt-4 text-[#777] font-bold text-base">
                <button class="py-2 active-tab" onclick="switchFeedTab('latest', this)">Latest</button>
                <button class="py-2" onclick="switchFeedTab('trending', this)">🔥 Trending</button>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar px-4 py-3 border-b border-[#222]">
            <button class="active-filter bg-[#1d9bf0] text-white text-xs font-bold px-4 py-1.5 rounded-full whitespace-nowrap" onclick="filterByCategory('all', this)">All Feed</button>
            <button class="bg-transparent border border-[#333] text-[#71767b] text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap" onclick="filterByCategory('general', this)">🌐 General</button>
            <button class="bg-transparent border border-[#333] text-[#71767b] text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap" onclick="filterByCategory('cs101', this)">💻 CS101</button>
            <button class="bg-transparent border border-[#333] text-[#71767b] text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap" onclick="filterByCategory('math201', this)">📐 MATH201</button>
            <button class="bg-transparent border border-[#333] text-[#71767b] text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap" onclick="filterByCategory('professor', this)">🧑‍🏫 Professor</button>
            <button class="bg-transparent border border-[#333] text-[#71767b] text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap" onclick="filterByCategory('campus', this)">🏫 Campus</button>
        </div>

        <!-- Post Input -->
        <div class="p-4 border-b border-[#222]">
            <div class="flex gap-3">
                <div class="w-12 h-12 rounded-full bg-[#1d9bf0] flex items-center justify-center text-xl flex-shrink-0"><i class="far fa-user"></i></div>
                <div class="flex-1">
                    <textarea id="post-textarea" maxlength="280" rows="2" class="w-full bg-transparent text-white text-xl resize-none outline-none placeholder-[#71767b]" placeholder="What's happening on campus?"></textarea>
                    <div class="flex justify-between items-center mt-2 pt-3 border-t border-[#222]">
                        <select id="category-select" class="bg-[#16181c] text-white text-xs rounded-full px-3 py-1.5 border-none outline-none">
                            <option value="general">General</option>
                            <option value="cs101">CS101</option>
                            <option value="math201"> MATH201</option>
                            <option value="professor">Professor</option>
                            <option value="campus">Campus</option>
                        </select>
                        <div class="flex items-center gap-3">
                            <span id="char-counter" class="text-xs text-[#71767b]">0/280</span>
                            <button id="submit-post-btn" class="bg-[#1d9bf0] text-white font-bold px-5 py-1.5 rounded-full text-sm disabled:opacity-50" onclick="handlePostSubmit()">Post</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="feed-container" class="divide-y divide-[#222]"></div>

        <!-- Session Badge -->
        <div class="text-center text-[#71767b] text-[10px] py-3" id="session-badge"></div>
    </div>

    <!-- Floating Button -->
    <button class="fixed bottom-[80px] right-[calc(50%-165px)] w-14 h-14 bg-[#1d9bf0] rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 w-full max-w-[430px] bg-black border-t border-[#222] flex justify-around py-3 text-2xl">
        <i class="fas fa-home text-white"></i>
        <i class="fas fa-search text-white"></i>
        <i class="far fa-bell text-white"></i>
        <i class="far fa-user text-white"></i>
    </div>

    <!-- Thread Modal -->
    <div id="thread-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-end justify-center">
        <div class="bg-black w-full max-w-[430px] max-h-[90vh] rounded-t-2xl flex flex-col overflow-hidden">
            <div class="sticky top-0 bg-black border-b border-[#222] p-4 flex justify-between items-center">
                <h3 class="font-bold text-xl">Discussion</h3>
                <button class="w-9 h-9 rounded-full hover:bg-[#222] flex items-center justify-center text-2xl" onclick="closeThreadModal()">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <div id="modal-focus-post" class="bg-[#16181c] p-4 rounded-xl"></div>
                <div class="text-[#71767b] text-sm font-bold pb-2 border-b border-[#222]">Comments</div>
                <div id="modal-comments-container" class="space-y-3"></div>
            </div>
            <div class="border-t border-[#222] p-4 flex gap-3">
                <textarea id="reply-textarea" rows="2" class="flex-1 bg-[#16181c] text-white rounded-2xl p-3 text-sm resize-none outline-none placeholder-[#71767b]" placeholder="Post an anonymous reply..."></textarea>
                <button class="bg-[#1d9bf0] text-white font-bold px-5 rounded-full text-sm" onclick="handleReplySubmit()">Reply</button>
            </div>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>
