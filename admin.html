<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Analytics | CampusCrypt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .header h1 { 
            font-size: 24px; 
            color: #1d9bf0; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .back-btn {
            background: transparent;
            border: 1px solid #2f3336;
            color: #e7e9ea;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
        }
        .back-btn:hover { background: #16181c; }
        .admin-badge {
            background: #f9188010;
            border-left: 4px solid #f91880;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #f91880;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #16181c;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2f3336;
        }
        .stat-value { font-size: 32px; font-weight: bold; color: #1d9bf0; }
        .stat-value.online { color: #00ba7c; }
        .stat-label { color: #71767b; margin-top: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .chart-container {
            background: #16181c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2f3336;
        }
        .chart-container h3 { 
            margin-bottom: 14px; 
            font-size: 15px; 
            color: #e7e9ea; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .trend-list {
            background: #000;
            border-radius: 12px;
            border: 1px solid #2f3336;
            overflow: hidden;
        }
        .trend-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #2f3336;
        }
        .trend-item:last-child { border-bottom: none; }
        .trend-keyword { color: #1d9bf0; font-weight: bold; }
        .trend-count { color: #71767b; font-size: 13px; }
        .peak-bars {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 12px 4px;
            min-height: 160px;
            align-items: flex-end;
        }
        .peak-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 36px;
        }
        .peak-bar {
            width: 24px;
            background: #1d9bf0;
            border-radius: 4px 4px 0 0;
            transition: height 0.3s;
        }
        .peak-label {
            font-size: 9px;
            color: #71767b;
            transform: rotate(-45deg);
            margin-top: 4px;
        }
        .peak-value {
            font-size: 9px;
            color: #1d9bf0;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .peak-bar-wrapper { min-width: 28px; }
            .peak-bar { width: 18px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1></i> Admin</h1>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Feed</a>
    </div>
    
    <div class="admin-badge">
        <i class="fa-solid fa-shield-halved"></i> ADMIN ACCESS ONLY — Moderation & Analytics Dashboard
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value online" id="onlineCount">0</div>
            <div class="stat-label"><i class="fa-solid fa-users"></i> Online Now</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalVisitors">-</div>
            <div class="stat-label"><i class="fa-solid fa-user"></i> Total Visitors</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalPosts">-</div>
            <div class="stat-label"><i class="fa-solid fa-message"></i> Total Posts</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalReplies">-</div>
            <div class="stat-label"><i class="fa-solid fa-reply"></i> Total Replies</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalLikes">-</div>
            <div class="stat-label"><i class="fa-solid fa-heart"></i> Total Likes</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="activeToday">-</div>
            <div class="stat-label"><i class="fa-solid fa-calendar-day"></i> Active Today</div>
        </div>
    </div>
    
    <div class="chart-container">
        <h3><i class="fa-solid fa-fire" style="color:#f91880;"></i> Trending Topics (24h)</h3>
        <div id="trendingList" class="trend-list">
            <div class="trend-item" style="justify-content: center; color: #71767b;">Loading trends...</div>
        </div>
    </div>
    
    <div class="chart-container">
        <h3><i class="fa-solid fa-clock"></i> Peak Usage Times (Hour of Day)</h3>
        <div id="peakBars" class="peak-bars">
            <div style="text-align: center; width: 100%; color: #71767b; padding: 20px 0;">Loading data...</div>
        </div>
    </div>
</div>

<script>
// 2. Setup your configuration variables
const SUPABASE_URL = 'https://xtqfbaqckgodxmsnyexh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0cWZiYXFja2dvZHhtc255ZXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTgwODIsImV4cCI6MjA5Njg3NDA4Mn0.cWsx_9gyk3m9Dz6ZMn_8qHQ0s_20qiNvJTUn8Q0p3uM';

// Initialize the client under our distinct name
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Helper to update text contents safely
function setElementText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
}

// ==========================================
// REAL-TIME PRESENCE ENGINE
// ==========================================
function initAdminPresence() {
    const presenceChannel = supabaseClient.channel('campus_crypt_analytics');
    
    presenceChannel
        .on('presence', { event: 'sync' }, () => {
            const newState = presenceChannel.presenceState();
            const totalOnlineNow = Object.keys(newState).length;
            setElementText('onlineCount', totalOnlineNow);
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await presenceChannel.track({
                    online_at: new Date().toISOString(),
                    user_session: 'admin_dashboard_view'
                });
                
                const immediateState = presenceChannel.presenceState();
                setElementText('onlineCount', Object.keys(immediateState).length || 1);
            }
        });
}

// ==========================================
// DATABASE HISTORICAL DATA LOADER ENGINE
// ==========================================
async function loadAdminDashboard() {
    try {
        const { count: postsCount } = await supabaseClient.from('posts').select('*', { count: 'exact', head: true });
        setElementText('totalPosts', postsCount || 0);
        
        const { count: repliesCount } = await supabaseClient.from('replies').select('*', { count: 'exact', head: true });
        setElementText('totalReplies', repliesCount || 0);
        
        const { data: likesData } = await supabaseClient.from('posts').select('likes_count');
        let totalLikes = 0;
        if (likesData) {
            totalLikes = likesData.reduce((sum, post) => sum + (parseInt(post.likes_count) || 0), 0);
        }
        setElementText('totalLikes', totalLikes);
        
        const { data: visitorView } = await supabaseClient.from('admin_unique_visitors').select('total_visitors');
        setElementText('totalVisitors', (visitorView && visitorView.length > 0) ? (visitorView[0].total_visitors || 0) : '0');
        
        const dayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        const { data: todayPosts } = await supabaseClient.from('posts').select('session_id').gte('created_at', dayAgo);
        setElementText('activeToday', todayPosts ? new Set(todayPosts.map(p => p.session_id)).size : 0);
        
        const { data: trends } = await supabaseClient.from('admin_trending_topics').select('*');
        const trendContainer = document.getElementById('trendingList');
        if (trendContainer) {
            trendContainer.innerHTML = (trends && trends.length > 0) ? trends.map(t => `
                <div class="trend-item">
                    <span class="trend-keyword">#${t.keyword}</span>
                    <span class="trend-count">${t.mention_count} mentions</span>
                </div>
            `).join('') : '<div class="trend-item" style="justify-content: center; color:#71767b;">No active word tracks yet</div>';
        }
        
        const { data: peakHours } = await supabaseClient.from('admin_peak_usage').select('*');
        const peakContainer = document.getElementById('peakBars');
        if (peakContainer) {
            if (peakHours && peakHours.length > 0) {
                const maxCount = Math.max(...peakHours.map(p => p.post_count), 1);
                peakContainer.innerHTML = peakHours.map(p => {
                    const hour = p.hour_of_day;
                    let displayHour = hour === 0 ? '12a' : (hour === 12 ? '12p' : (hour > 12 ? `${hour-12}p` : `${hour}a`));
                    const barHeight = Math.max(16, (p.post_count / maxCount) * 100);
                    return `
                        <div class="peak-bar-wrapper">
                            <span class="peak-value">${p.post_count}</span>
                            <div class="peak-bar" style="height: ${barHeight}px;"></div>
                            <span class="peak-label">${displayHour}</span>
                        </div>
                    `;
                }).join('');
            } else {
                peakContainer.innerHTML = '<div style="text-align: center; width: 100%; color:#71767b;">No data logged yet</div>';
            }
        }
    } catch (err) {
        console.error(" Admin dashboard rendering error:", err);
    }
}

initAdminPresence();
loadAdminDashboard();
</script>
</body>
</html>
